name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Appelé par release.yml : une release n'est publiée que si toute la CI passe.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter helm-desktop test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Serveur de synchronisation (projet Cargo séparé, construit dans son image Docker).
      - run: cargo fmt --manifest-path sync-server/Cargo.toml --check
      - run: cargo clippy --manifest-path sync-server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path sync-server/Cargo.toml

  # Clippy sous Windows : le code propre à Windows (import PuTTY, registre) n'est vérifié qu'ici.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Vulnérabilités connues dans les dépendances Rust et JavaScript.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Avis ignorés et justifiés dans .cargo/audit.toml ; les crates non maintenues restent des avertissements.
      - run: cargo audit
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  # Tests de bout en bout contre les deux faux VPS (Ubuntu root, Debian non-root avec fail2ban).
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Démarrage des faux VPS
        run: docker compose -f testenv/docker-compose.yml up -d --build
      - name: Attente de SSH
        run: |
          for port in 2222 2223; do
            for i in $(seq 1 90); do
              (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null && head -c 4 < /dev/tcp/127.0.0.1/$port | grep -q SSH && break
              sleep 2
            done
          done
          sleep 20
      - run: cargo run -p helm-core --example smoke
      - run: cargo run -p helm-core --example nginx_smoke
      - run: cargo run -p helm-core --example debian_smoke
      - name: Journaux des faux VPS en cas d'échec
        if: failure()
        run: |
          docker logs helm-test-vps | tail -50
          docker exec helm-test-debian tail -50 /var/log/auth.log

  # Agent helmd : binaires Linux statiques (x86_64 et arm64), embarqués ensuite dans l'app par release.yml.
  agent:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild -p helmd --release --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: helmd
          path: |
            target/x86_64-unknown-linux-musl/release/helmd
            target/aarch64-unknown-linux-musl/release/helmd
          if-no-files-found: error
