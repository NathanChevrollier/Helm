name: Release

# Déclenchée par un tag vX.Y.Z (voir `pnpm release`). Étapes : CI complète, release brouillon,
# compilation et signature des installeurs sur les trois OS, signature de code Windows (SignPath,
# dès que ses secrets existent), puis publication. Le latest.json joint à
# la release sert au module de mise à jour de l'app : il est écrit une seule fois, à la fin, car
# quatre machines qui le mettent à jour en parallèle s'écrasent (et l'une d'elles échoue).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  draft:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Le tag correspond à la version de l'app
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          cargo=$(sed -n '/\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          pkg=$(jq -r .version apps/desktop/package.json)
          echo "tag=$tag tauri=$conf cargo=$cargo package=$pkg"
          [ "$tag" = "$conf" ] && [ "$tag" = "$cargo" ] && [ "$tag" = "$pkg" ] || { echo "::error::Versions différentes : utilise pnpm release $tag"; exit 1; }
      - name: Release brouillon avec notes générées
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          # L'API renvoie directement l'id ; le rechercher ensuite dans la liste échoue parfois (brouillon pas encore listé).
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" -f name="Helm $GITHUB_REF_NAME" -F draft=true -F prerelease=$prerelease -F generate_release_notes=true --jq .id)
          [ -n "$id" ] || { echo "::error::Release non créée"; exit 1; }
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          # 22.04 : glibc plus ancienne, l'AppImage tourne sur davantage de distributions.
          - os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: helmd
          path: target
      - name: L'agent helmd est bien embarqué
        shell: bash
        run: |
          for arch in x86_64 aarch64; do
            f="target/$arch-unknown-linux-musl/release/helmd"
            [ -s "$f" ] || { echo "::error::$f absent : l'app serait publiée sans agent"; exit 1; }
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-target }}
      - name: Dépendances système Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.draft.outputs.release_id }}
          # Artefacts de mise à jour signés seulement ici : un build local n'a pas la clé privée.
          args: ${{ matrix.args }} --config ${{ github.workspace }}/apps/desktop/src-tauri/tauri.release.conf.json
          # Le manifeste des mises à jour est construit par le job « publish », à partir des
          # signatures déposées ici : sinon les quatre builds se le disputent.
          includeUpdaterJson: false

  # Signature de code de l'installeur Windows par la SignPath Foundation : elle supprime
  # l'avertissement SmartScreen « Éditeur inconnu ». Le job ne fait rien tant que les secrets
  # SignPath n'existent pas : la release fonctionne à l'identique avant l'approbation du projet.
  #
  # Piège à ne pas oublier : signer l'installeur change ses octets, donc invalide la signature de
  # mise à jour de Tauri (.sig). Elle est recalculée ici, puis installeur et .sig sont remplacés
  # ensemble sur la release. `publish` construit latest.json APRÈS ce job, donc avec la bonne
  # signature ; dans l'ordre inverse, les mises à jour automatiques échoueraient toutes.
  sign-windows:
    needs: [draft, build]
    runs-on: ubuntu-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
    steps:
      - name: SignPath configuré ?
        id: gate
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ] && [ -n "$SIGNPATH_PROJECT_SLUG" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets SignPath absents : l'installeur Windows reste non signé (voir packaging/README.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installeur Windows non signé
        if: steps.gate.outputs.enabled == 'true'
        id: unsigned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p unsigned
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p '*-setup.exe' -D unsigned
          file=$(ls unsigned/*-setup.exe)
          [ -s "$file" ] || { echo "::error::installeur Windows absent de la release"; exit 1; }
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"

      - name: Dépôt de l'installeur pour SignPath
        if: steps.gate.outputs.enabled == 'true'
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: unsigned/*-setup.exe
          if-no-files-found: error

      - name: Signature par SignPath
        if: steps.gate.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Vérification de la signature Authenticode
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          osslsigncode verify -in "signed/${{ steps.unsigned.outputs.name }}" | tee verify.log
          grep -q "Signature verification: ok" verify.log || { echo "::error::signature Authenticode invalide"; exit 1; }

      - name: Nouvelle signature de mise à jour Tauri
        if: steps.gate.outputs.enabled == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # L'ancien .sig portait sur l'installeur non signé : il ne correspond plus à rien.
          npx --yes @tauri-apps/cli@2 signer sign "signed/${{ steps.unsigned.outputs.name }}"
          [ -s "signed/${{ steps.unsigned.outputs.name }}.sig" ] || { echo "::error::signature Tauri non produite"; exit 1; }

      - name: Remplacement sur la release
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Installeur et .sig partent ensemble : l'un sans l'autre casserait les mises à jour.
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            "signed/${{ steps.unsigned.outputs.name }}" \
            "signed/${{ steps.unsigned.outputs.name }}.sig"

  publish:
    needs: [draft, build, sign-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifeste des mises à jour (latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/latest-json.py "$GITHUB_REF_NAME"
      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.release_id }}" --jq '.assets[].name' | sort
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.release_id }}" --jq '.assets[].name' | grep -qx latest.json \
            || { echo "::error::latest.json manquant : les mises à jour automatiques ne verraient pas cette version"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.release_id }}" -F draft=false
