# Faux VPS de test, ISOLÉ : il a son propre démon Docker (Docker-in-Docker) et ne voit jamais
# les conteneurs de ta machine. Tout peut y être cassé sans risque.
#
#   pnpm testenv                      (ou : docker compose -f testenv/docker-compose.yml up -d --build)
#   SSH : 127.0.0.1:2222   root / helm   ou   deploy / deploy (sudo avec mot de passe)
#   Tout supprimer :  docker compose -f testenv/docker-compose.yml down -v
services:
  # Démon Docker privé du faux VPS. Le VPS partage son réseau : 127.0.0.1 est le même pour les
  # deux, comme sur un vrai serveur où nginx joint les conteneurs sur 127.0.0.1:PORT.
  dind:
    image: docker:27-dind
    container_name: helm-test-dind
    hostname: test-vps
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-run:/var/run
      - dind-data:/var/lib/docker
    ports:
      - "127.0.0.1:2222:22"

  vps:
    build: .
    container_name: helm-test-vps
    network_mode: "service:dind"
    volumes:
      - dind-run:/var/run/dind
    depends_on:
      - dind

volumes:
  dind-run:
  dind-data:
