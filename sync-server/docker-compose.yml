services:
  zenytt-sync:
    build: .
    image: zenytt-sync:latest
    container_name: zenytt-sync
    restart: unless-stopped
    environment:
      # Un ou plusieurs jetons séparés par des virgules (openssl rand -hex 32), à mettre dans .env.
      # Le .env d'une installation antérieure au renommage de l'app reste accepté.
      ZENYTT_SYNC_TOKENS: ${ZENYTT_SYNC_TOKENS:-${HELM_SYNC_TOKENS:?définis ZENYTT_SYNC_TOKENS dans le fichier .env}}
    volumes:
      - zenytt-sync-data:/data
    # Écoute seulement en local : nginx (HTTPS) est devant. Change le port s'il est déjà pris.
    ports:
      - "127.0.0.1:8091:8080"

volumes:
  zenytt-sync-data:
