[package]
name = "helm-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Serveur de synchronisation des réglages de Helm (contenu chiffré de bout en bout)"

# Projet indépendant du workspace de l'app : son image Docker se construit avec ce seul dossier.
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
tokio-tungstenite = "0.29"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
