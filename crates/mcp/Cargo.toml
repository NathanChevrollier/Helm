[package]
name = "zenytt-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Serveur MCP en lecture seule : donne à une IA l'accès aux données de tes serveurs, sans aucune action possible"

[dependencies]
zenytt-core.workspace = true
zenytt-profiles.workspace = true
zenytt-protocol.workspace = true
regex = "1"
rmcp = { version = "3.4.0", features = ["server", "transport-io", "macros"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
