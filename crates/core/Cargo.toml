[package]
name = "helm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSH, SFTP, tunnels, client Docker et parseur nginx"

[dependencies]
base64 = "0.23.1"
futures = { version = "0.3.34", default-features = false, features = ["alloc"] }
helm-protocol.workspace = true
ring = "0.17"
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
ureq = "3.4"
