ShortDescription: Manage, browse and monitor your servers from a single desktop app.
Description: |-
  Helm brings together what usually takes four separate tools: an SSH terminal with persistent
  sessions, an SFTP file browser, Docker management, databases, nginx sites, tunnels, backups
  and monitoring.

  Everything goes over a plain SSH connection — no agent is required on the server — and secrets
  are kept in the operating system's credential store, never in plain text.
