ShortDescription: Gestion, navigation et surveillance de serveurs, dans une seule application.
Description: |-
  Zenytt réunit dans une application de bureau ce qui demande habituellement quatre outils :
  terminal SSH avec sessions persistantes, explorateur de fichiers SFTP, gestion Docker,
  bases de données, sites nginx, tunnels, sauvegardes et supervision.

  Tout passe par une connexion SSH ordinaire : aucun agent n'est obligatoire sur le serveur,
  et les secrets sont conservés dans le gestionnaire d'identifiants du système, jamais en clair.
