services:
  helm-discord-bot:
    build:
      context: ../..
      dockerfile: apps/discord-bot/Dockerfile
    container_name: helm-discord-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
