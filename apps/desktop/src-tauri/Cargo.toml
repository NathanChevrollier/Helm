[package]
name = "helm-desktop"
description = "Helm — gestion, navigation et surveillance de VPS"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows (cargo#8519).
name = "helm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
helm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
helm-profiles.workspace = true
helm-mcp.workspace = true
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { workspace = true, features = ["full"] }
base64 = "0.23.1"
tauri-plugin-dialog = "2.7.3"
helm-protocol.workspace = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
