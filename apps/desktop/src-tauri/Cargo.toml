[package]
name = "helm-desktop"
description = "Helm — gestion, navigation et surveillance de VPS"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows (cargo#8519).
name = "helm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
helm-ai.workspace = true
helm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
helm-profiles.workspace = true
helm-mcp.workspace = true
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { workspace = true, features = ["full"] }
base64 = "0.23.1"
tauri-plugin-dialog = "2.7.3"
helm-protocol.workspace = true
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-notification = "2"
ring = "0.17"
ureq = { version = "3.4", features = ["json"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2.3.3"
# Pont RDP : protocole de passerelle du client web IronRDP, et TLS vers la machine distante.
ironrdp-rdcleanpath = "0.2"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
